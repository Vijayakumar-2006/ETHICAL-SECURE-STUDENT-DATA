<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Student Data System</title>
    <link rel="stylesheet" href="style.css?v=20260605-3">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <h1 id="form-title">Login</h1>
            <p id="form-subtitle">Access the secure portal.</p>
            
            <form id="auth-form">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" required placeholder="Enter username">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Enter password">
                </div>
                <div class="input-group">
                    <label id="captcha-label">Security Check</label>
                    <div style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
                        <canvas id="captcha-canvas" width="150" height="40" style="border-radius: 8px; border: 1px solid var(--card-border); background: #f3f4f6;"></canvas>
                        <button type="button" id="refresh-captcha" class="btn secondary-btn" style="padding: 0.4rem 0.8rem; width: auto;" title="Refresh CAPTCHA">↻</button>
                    </div>
                    <div style="position: relative;">
                        <input type="text" id="captcha" required placeholder="Enter the text above" style="padding-right: 30px;">
                        <span id="captcha-status" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-weight: bold; font-size: 1.2rem;"></span>
                    </div>
                </div>
                <button type="submit" class="btn primary-btn" id="submit-btn">Login</button>
            </form>
            <div id="message-container" class="message"></div>
        </div>
    </div>
    <script src="app.js?v=20260513-2"></script>
</body>
</html>
